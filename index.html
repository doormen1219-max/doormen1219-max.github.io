<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<title>PriceTag Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#f5f5f5;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
header{padding:14px 16px;background:#181818;position:sticky;top:0;z-index:5;font-weight:800;font-size:19px}
main{max-width:960px;margin:auto;padding:10px}
#camera{width:100%;background:#000;border-radius:14px;overflow:hidden;display:flex;justify-content:center}
#camera video{width:100%;height:auto;max-height:65vh;object-fit:contain}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
button{border:0;border-radius:11px;padding:14px 8px;font-size:15px;font-weight:800}
.primary{background:#fff;color:#111}.secondary{background:#2b2b2b;color:#fff}
button:disabled{opacity:.45}
#status{min-height:40px;padding:8px 2px;color:#bbb}
#ocr{white-space:pre-wrap;background:#181818;border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,monospace;color:#bbb;max-height:180px;overflow:auto}
.wrap{overflow:auto;margin-top:10px;border-radius:10px}
table{width:100%;min-width:930px;border-collapse:collapse;background:#181818;font-size:13px}
th,td{padding:9px;border-bottom:1px solid #333;text-align:left;vertical-align:top}th{background:#222}
.small{color:#888;font-size:12px;line-height:1.4}
</style>
</head>
<body>
<header>PriceTag Scanner</header>
<main>
<div id="camera"></div>
<div class="controls">
<button id="start" class="primary">ЗАПУСТИТЬ КАМЕРУ</button>
<button id="scan" class="secondary">СКАНИРОВАТЬ ЦЕННИК</button>
<button id="export" class="secondary">ЭКСПОРТ XLSX</button>
<button id="clear" class="secondary">ОЧИСТИТЬ</button>
</div>
<div id="status">Готов.</div>
<div class="small">
Подход: 1) детектор 2D/QR отдельно; 2) 4 ориентации; 3) цена — только из крупной числовой области;
4) единица только шт / кг / 100г; 5) английские буквы и «|» в названии запрещены.
</div>
<div id="ocr"></div>
<div class="wrap"><table>
<thead><tr><th>Название</th><th>Цена</th><th>Код товара</th><th>Мера</th><th>Дата</th><th>2D-код</th></tr></thead>
<tbody id="rows"></tbody>
</table></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
let stream = null, worker = null;
let rows = JSON.parse(localStorage.getItem("priceRowsV6") || "[]");
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function render() {
  $("rows").innerHTML = rows.map(r =>
    `<tr><td>${esc(r.name)}</td><td>${esc(r.price)}</td><td>${esc(r.barcode)}</td><td>${esc(r.unit)}</td><td>${esc(r.date)}</td><td>${esc(r.code2d)}</td></tr>`
  ).join("");
  localStorage.setItem("priceRowsV6", JSON.stringify(rows));
}

function clean(s) {
  s = String(s || "")
    .replace(/[|¦∥ǀ]/g, " ")          // | вообще не должен появляться
    .replace(/[A-Za-z]/g, "")           // английские буквы — вон
    .replace(/\s+/g, " ")
    .trim();
  // частые OCR-ошибки русских слов
  s = s
    .replace(/\b[Xx][еeё]\b/giu, "Хе")
    .replace(/\b[PРR]\b/g, "₽")
    .replace(/\b[RР][Ыы]бн(?:ый|ьи|ь[ыи])\s+цех\b/iu, "Рыбный цех")
    .replace(/\bтолстолобика?\b/iu, "толстолобика");
  return s.replace(/^[\s.,:;=_-]+|[\s.,:;=_-]+$/g, "");
}

function rotate(src, deg) {
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  if (deg === 90 || deg === 270) {
    c.width = src.height; c.height = src.width;
  } else {
    c.width = src.width; c.height = src.height;
  }
  ctx.translate(c.width / 2, c.height / 2);
  ctx.rotate(deg * Math.PI / 180);
  ctx.drawImage(src, -src.width / 2, -src.height / 2);
  return c;
}

// Простая попытка «вырезать» сам ценник: ищем самый контрастный прямоугольник
function cropPriceTag(src) {
  const maxSide = 1600;
  const scale = Math.min(1, maxSide / Math.max(src.width, src.height));
  const w = Math.round(src.width * scale);
  const h = Math.round(src.height * scale);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(src, 0, 0, w, h);

  const im = ctx.getImageData(0, 0, w, h);
  const d = im.data;
  // бинаризация + поиск bounding box нечёрных пикселей
  let minX = w, minY = h, maxX = 0, maxY = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const yv = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const v = yv > 140 ? 255 : 0;          // белый фон ценника
      d[i] = d[i + 1] = d[i + 2] = v;
      if (v > 200) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  ctx.putImageData(im, 0, 0);

  // если нашли осмысленный прямоугольник — кропаем с небольшим запасом
  if (maxX - minX > w * 0.25 && maxY - minY > h * 0.15) {
    const pad = 8;
    minX = Math.max(0, minX - pad);
    minY = Math.max(0, minY - pad);
    maxX = Math.min(w - 1, maxX + pad);
    maxY = Math.min(h - 1, maxY + pad);
    const out = document.createElement("canvas");
    out.width = maxX - minX + 1;
    out.height = maxY - minY + 1;
    out.getContext("2d").drawImage(c, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
    return out;
  }
  return c; // fallback — весь кадр
}

function prep(src) {
  // усиление контраста + серый
  const max = 1400;
  const scale = Math.min(1, max / Math.max(src.width, src.height));
  const c = document.createElement("canvas");
  c.width = Math.round(src.width * scale);
  c.height = Math.round(src.height * scale);
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(src, 0, 0, c.width, c.height);
  const im = ctx.getImageData(0, 0, c.width, c.height);
  const d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    const z = Math.max(0, Math.min(255, (y - 128) * 1.55 + 128));
    d[i] = d[i + 1] = d[i + 2] = z;
  }
  ctx.putImageData(im, 0, 0);
  return c;
}

async function ensureWorker() {
  if (worker) return;
  $("status").textContent = "Загрузка русского OCR…";
  worker = await Tesseract.createWorker("rus", 1, {
    logger: m => {
      if (m.status === "loading language traineddata")
        $("status").textContent = "Загрузка OCR " + Math.round((m.progress || 0) * 100) + "%";
      if (m.status === "recognizing text")
        $("status").textContent = "Распознавание " + Math.round((m.progress || 0) * 100) + "%";
    }
  });
  // PSM 6 = assume a single uniform block of text (лучше для ценника)
  await worker.setParameters({
    tessedit_pageseg_mode: "6",
    preserve_interword_spaces: "1",
    user_defined_dpi: "300",
    tessedit_char_whitelist: "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя0123456789.,₽/- "
  });
}

function wordsFrom(data) {
  return (data.words || []).map(w => ({
    text: clean(w.text),
    conf: Number(w.confidence || w.conf || 0),
    bbox: w.bbox || { x0: 0, y0: 0, x1: 0, y1: 0 },
    h: (w.bbox?.y1 || 0) - (w.bbox?.y0 || 0)
  })).filter(w => w.text);
}

/* ---------- ЦЕНА: только крупная числовая область ---------- */
function extractPrice(data) {
  const ws = wordsFrom(data);
  // ищем слова, которые выглядят как цена (1–6 цифр, возможно с запятой)
  const candidates = [];
  for (const w of ws) {
    const t = w.text.replace(/,/g, ".").replace(/[^\d.]/g, "");
    if (!/^\d{1,6}(?:\.\d{1,2})?$/.test(t)) continue;
    const num = Number(t);
    if (num < 1 || num > 999999) continue;
    // «крупность» = высота bbox
    candidates.push({ value: t, score: w.h * (w.conf / 50), conf: w.conf });
  }
  if (!candidates.length) return "";
  // берём самую крупную + уверенную
  candidates.sort((a, b) => b.score - a.score);
  return candidates[0].value;
}

/* ---------- ДАТА ---------- */
function extractDate(text) {
  const t = String(text || "").replace(/\s+/g, " ");
  // 29.08.26  /  29/08/26  /  29-08-2026
  let m = t.match(/\b(0?[1-9]|[12]\d|3[01])\s*[./-]\s*(0?[1-9]|1[0-2])\s*[./-]\s*(20\d{2}|\d{2})\b/);
  if (!m) {
    const compact = t.replace(/(\d)\s+(?=\d)/g, "$1");
    m = compact.match(/\b(0?[1-9]|[12]\d|3[01])[./-](0?[1-9]|1[0-2])[./-](20\d{2}|\d{2})\b/);
  }
  if (!m) return "";
  let y = m[3];
  if (y.length === 2) y = "20" + y;
  return `${m[1].padStart(2, "0")}.${m[2].padStart(2, "0")}.${y.slice(-2)}`;
}

/* ---------- ЕДИНИЦА: только шт / кг / 100г ---------- */
function extractUnit(text) {
  const t = String(text || "").toLowerCase()
    .replace(/кr|кг\./g, "кг")
    .replace(/\bк\s*г\b/g, "кг")
    .replace(/100\s*г/g, "100г");
  if (/\b100г\b/.test(t)) return "100г";
  if (/\bкг\b/.test(t)) return "кг";
  if (/\bшт\b/.test(t)) return "шт";
  return "";
}

/* ---------- НАЗВАНИЕ ---------- */
function nameScore(s) {
  let n = 0;
  if (/[А-Яа-яЁё]/.test(s)) n += 120;
  if (/рыбный\s+цех/iu.test(s)) n += 90;
  if (/\bхе\b/iu.test(s)) n += 60;
  if (/толстолобик/iu.test(s)) n += 80;
  if (/\bиз\b/iu.test(s)) n += 20;
  if (/\d{7,}/.test(s)) n -= 200;          // не берём код товара
  if (/^(?:кг|шт|100г|руб|₽)$/iu.test(s)) n -= 300;
  return n + Math.min(50, s.length);
}

function extractName(text, price, unit, date, barcode) {
  const lines = String(text || "").split(/\n+/).map(x => clean(x)).filter(Boolean);
  const out = [];
  for (let line of lines) {
    let s = line;
    if (price) s = s.replace(new RegExp("(?<!\\d)" + price.replace(".", "[.,]") + "\\s*(?:₽|руб\\.?)?", "iu"), " ");
    if (date)  s = s.replace(new RegExp(date.replace(/\./g, "[.]?\\s*"), "i"), " ");
    if (barcode) s = s.replace(barcode, " ");
    if (unit)  s = s.replace(new RegExp("\\b" + unit + "\\b", "iu"), " ");
    s = clean(s);
    if (!/[А-Яа-яЁё]/.test(s)) continue;
    if (/^(?:₽|руб|кг|шт|100г)$/iu.test(s)) continue;
    out.push(s);
  }
  if (!out.length) return "";
  return clean(out.sort((a, b) => nameScore(b) - nameScore(a))[0]);
}

function parse(data, codes) {
  const text = clean(data.text || "");
  const price = extractPrice(data);               // ← только крупная область
  const unit  = extractUnit(text);
  const date  = extractDate(text);

  const two = codes.find(x => /^(qr_code|data_matrix|pdf417|aztec)$/i.test(x.format));
  const one = codes.find(x => /^(ean_13|ean_8|upc_a|upc_e|code_128|code_39|itf|codabar)$/i.test(x.format));

  const code2d = two?.rawValue || "";
  // если QR содержит 13-значный код — это код товара
  let barcode = one?.rawValue || "";
  if (!barcode && /^\d{8,14}$/.test(code2d)) barcode = code2d;

  const name = extractName(text, price, unit, date, barcode);

  const useful =
    (name ? 130 : 0) +
    (price ? 110 : 0) +
    (unit ? 60 : 0) +
    (date ? 40 : 0) +
    (barcode ? 50 : 0);

  return {
    name, price, unit, date, barcode, code2d,
    raw: text,
    confidence: Number(data.confidence || 0),
    useful
  };
}

async function ocrOrientation(base, deg, codes) {
  const rotated = rotate(base, deg);
  const cropped = cropPriceTag(rotated);   // сначала вырезаем ценник
  const prepared = prep(cropped);
  const data = await worker.recognize(prepared);
  return { deg, ...parse(data, codes) };
}

async function detectCodes(canvas) {
  if (!("BarcodeDetector" in window)) return [];
  try {
    const supported = await BarcodeDetector.getSupportedFormats();
    const wanted = ["qr_code","data_matrix","pdf417","aztec","ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf","codabar"];
    const formats = wanted.filter(x => supported.includes(x));
    return formats.length ? await new BarcodeDetector({ formats }).detect(canvas) : [];
  } catch (e) {
    return [];
  }
}

async function capture() {
  if (!stream) {
    $("status").textContent = "Сначала запусти камеру.";
    return;
  }
  const v = $("camera").querySelector("video");
  if (!v || !v.videoWidth) {
    $("status").textContent = "Камера ещё запускается.";
    return;
  }
  $("scan").disabled = true;
  try {
    const full = document.createElement("canvas");
    full.width = v.videoWidth;
    full.height = v.videoHeight;
    full.getContext("2d").drawImage(v, 0, 0);

    const codes = await detectCodes(full);   // QR/штрихкод — только декодером
    await ensureWorker();

    const results = [];
    // всегда все 4 ориентации
    for (const deg of [0, 90, 180, 270]) {
      results.push(await ocrOrientation(full, deg, codes));
    }

    const best = results.sort((a, b) =>
      (b.useful + b.confidence * 0.4) - (a.useful + a.confidence * 0.4)
    )[0];

    // ещё раз подтягиваем код из детектора (на случай если OCR его пропустил)
    const two = codes.find(x => /^(qr_code|data_matrix|pdf417|aztec)$/i.test(x.format));
    const one = codes.find(x => /^(ean_13|ean_8|upc_a|upc_e|code_128|code_39|itf|codabar)$/i.test(x.format));
    best.code2d = two?.rawValue || best.code2d || "";
    if (one?.rawValue) best.barcode = one.rawValue;
    else if (/^\d{8,14}$/.test(best.code2d)) best.barcode = best.code2d;

    const row = {
      name: best.name,
      price: best.price,
      barcode: best.barcode,
      unit: best.unit,
      date: best.date,
      code2d: best.code2d
    };
    rows.push(row);
    render();

    $("ocr").textContent = results.map(r =>
      `--- ${r.deg}° (useful=${r.useful}, conf=${Math.round(r.confidence)}) ---\n${r.raw}`
    ).join("\n\n");

    $("status").textContent =
      `Готово #${rows.length}: ${row.name || "—"} | ${row.price || "—"} ₽ | ${row.unit || "—"} | ${row.date || "—"} | ${row.barcode || "—"}`;
  } catch (e) {
    $("status").textContent = "Ошибка: " + e.message;
  } finally {
    $("scan").disabled = false;
  }
}

async function startCamera() {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    const v = document.createElement("video");
    v.autoplay = true; v.playsInline = true; v.muted = true;
    v.srcObject = stream;
    $("camera").innerHTML = "";
    $("camera").appendChild(v);
    $("status").textContent = "Камера готова.";
  } catch (e) {
    $("status").textContent = "Нет доступа к камере: " + e.message;
  }
}

$("start").onclick = startCamera;
$("scan").onclick = capture;
$("clear").onclick = () => {
  if (confirm("Удалить все строки?")) {
    rows = [];
    render();
    $("ocr").textContent = "";
  }
};
$("export").onclick = () => {
  if (!rows.length) {
    $("status").textContent = "Нет данных.";
    return;
  }
  const data = rows.map((r, i) => ({
    "№": i + 1,
    "Название": r.name,
    "Цена": r.price,
    "Код товара": r.barcode,
    "Мера": r.unit,
    "Дата": r.date,
    "2D-код": r.code2d
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws["!cols"] = [{wch:6},{wch:45},{wch:12},{wch:18},{wch:10},{wch:12},{wch:28}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Ценники");
  XLSX.writeFile(wb, "price_tags.xlsx");
};

render();
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
