<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<title>PriceTag Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#f5f5f5;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
header{padding:14px 16px;background:#181818;position:sticky;top:0;z-index:5;font-weight:800;font-size:19px}
main{max-width:960px;margin:auto;padding:10px}
#camera{width:100%;background:#000;border-radius:14px;overflow:hidden;display:flex;justify-content:center}
#camera video{width:100%;height:auto;max-height:65vh;object-fit:contain}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
button{border:0;border-radius:11px;padding:14px 8px;font-size:15px;font-weight:800}
.primary{background:#fff;color:#111}.secondary{background:#2b2b2b;color:#fff}
button:disabled{opacity:.45}
#status{min-height:40px;padding:8px 2px;color:#bbb}
#ocr{white-space:pre-wrap;background:#181818;border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,monospace;color:#bbb;max-height:180px;overflow:auto}
.wrap{overflow:auto;margin-top:10px;border-radius:10px}
table{width:100%;min-width:930px;border-collapse:collapse;background:#181818;font-size:13px}
th,td{padding:9px;border-bottom:1px solid #333;text-align:left;vertical-align:top}th{background:#222}
.small{color:#888;font-size:12px;line-height:1.4}
</style>
</head>
<body>
<header>PriceTag Scanner</header>
<main>
<div id="camera"></div>
<div class="controls">
<button id="start" class="primary">ЗАПУСТИТЬ КАМЕРУ</button>
<button id="scan" class="secondary">СКАНИРОВАТЬ ЦЕННИК</button>
<button id="export" class="secondary">ЭКСПОРТ XLSX</button>
<button id="clear" class="secondary">ОЧИСТИТЬ</button>
</div>
<div id="status">Готов.</div>
<div class="small">Сканирование: код товара из QR/2D определяется отдельно; текст ценника распознаётся в 0° и 90° и выбирается по качеству. Для цены требуется число рядом с ₽/Р/P/руб.</div>
<div id="ocr"></div>
<div class="wrap"><table><thead><tr><th>Название</th><th>Цена</th><th>Штрихкод / код товара</th><th>Мера</th><th>Дата</th><th>2D-код</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
let stream=null,worker=null;
let rows=JSON.parse(localStorage.getItem("priceRowsV5")||"[]");
const $=id=>document.getElementById(id);
const RU_FIXES=[
 [/\\b[Xx][еeё]\\b/gu,"Хе"],[/\\b[Xx]е\\b/gu,"Хе"],[/\\b[PРR]\\b/g,"₽"],
 [/\\b[RР][Ыы]бн(?:ый|ьи|ь[ыи])\\s+цех\\b/iu,"Рыбный цех"]
];
function clean(s){
 s=String(s||"").replace(/[|¦]/g," ").replace(/\\s+/g," ").trim();
 for(const [a,b] of RU_FIXES)s=s.replace(a,b);
 s=s.replace(/^[\\s.,:;|_=-]+|[\\s.,:;|_=-]+$/g,"");
 return s;
}
function render(){
 $("rows").innerHTML=rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.price)}</td><td>${esc(r.barcode)}</td><td>${esc(r.unit)}</td><td>${esc(r.date)}</td><td>${esc(r.code2d)}</td></tr>`).join("");
 localStorage.setItem("priceRowsV5",JSON.stringify(rows));
}
function esc(s){return String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}

function rotate(src,deg){
 const c=document.createElement("canvas"),ctx=c.getContext("2d");
 if(deg===90||deg===270){c.width=src.height;c.height=src.width}else{c.width=src.width;c.height=src.height}
 ctx.translate(c.width/2,c.height/2);ctx.rotate(deg*Math.PI/180);ctx.drawImage(src,-src.width/2,-src.height/2);return c;
}
function prep(src){
 const max=1500,scale=Math.min(1,max/Math.max(src.width,src.height));
 const c=document.createElement("canvas");c.width=Math.round(src.width*scale);c.height=Math.round(src.height*scale);
 const ctx=c.getContext("2d",{willReadFrequently:true});ctx.drawImage(src,0,0,c.width,c.height);
 const im=ctx.getImageData(0,0,c.width,c.height),d=im.data;
 for(let i=0;i<d.length;i+=4){
   const y=.299*d[i]+.587*d[i+1]+.114*d[i+2];
   const z=Math.max(0,Math.min(255,(y-128)*1.45+128));
   d[i]=d[i+1]=d[i+2]=z;
 }
 ctx.putImageData(im,0,0);return c;
}
async function ensureWorker(){
 if(worker)return;
 $("status").textContent="Загрузка русского OCR…";
 worker=await Tesseract.createWorker("rus+eng",1,{logger:m=>{
   if(m.status==="loading language traineddata")$("status").textContent="Загрузка OCR "+Math.round((m.progress||0)*100)+"%";
   if(m.status==="recognizing text")$("status").textContent="Распознавание "+Math.round((m.progress||0)*100)+"%";
 }});
 await worker.setParameters({tessedit_pageseg_mode:"11",preserve_interword_spaces:"1",user_defined_dpi:"300"});
}
function normalizedText(t){
 return clean(t).replace(/\\b[PРR]\\s*\\.?/g,"₽");
}
function wordsText(data){return (data.words||[]).map(w=>({text:clean(w.text),conf:Number(w.confidence||w.conf||0),bbox:w.bbox||{}}));}

function extractPrice(data,text){
 const ws=wordsText(data);
 // 1) Prefer a numeric OCR word immediately followed by a currency OCR word.
 for(let i=0;i<ws.length;i++){
   const n=ws[i].text.replace(/,/g,".");
   if(!/^\\d{1,6}(?:\\.\\d{1,2})?$/.test(n))continue;
   const next=ws[i+1]?.text||"";
   if(/^(?:₽|P|Р|R|руб\\.?|рублей?)$/iu.test(next)){
     return n;
   }
   if(/(?:₽|P|Р|R|руб)/iu.test(next))return n;
 }
 // 2) Same-line text regex, accepting common OCR substitutions for ₽.
 const t=String(text||"").replace(/\\u00a0/g," ");
 const patterns=[
   /(?<![\\d.,])([0-9]{1,6}(?:[.,][0-9]{1,2})?)\\s*(?:₽|руб(?:\\.|лей)?|[PРRрp])\\b/giu,
   /(?<![\\d.,])([0-9]{1,6}(?:[.,][0-9]{1,2})?)\\s*[PРRрp]\\s*[.·:;,]*/gu
 ];
 let cand=[];
 for(const re of patterns)for(const m of t.matchAll(re))cand.push(m[1].replace(",","."));
 if(cand.length){
   // Prefer the largest plausible price; this eliminates 8/29/etc. on typical tags.
   cand=cand.filter(x=>Number(x)>=1&&Number(x)<=999999);
   return cand.sort((a,b)=>Number(b)-Number(a))[0]||"";
 }
 return "";
}
function extractDate(text){
 const t=String(text||"").replace(/\\s+/g," ");
 let m=t.match(/\\b(0?[1-9]|[12]\\d|3[01])\\s*[./-]\\s*(0?[1-9]|1[0-2])\\s*[./-]\\s*(20\\d{2}|\\d{2}|\\d)\\b/);
 if(!m){const q=t.replace(/(\\d)\\s+(?=\\d)/g,"$1");m=q.match(/\\b(0?[1-9]|[12]\\d|3[01])[./-](0?[1-9]|1[0-2])[./-](20\\d{2}|\\d{2}|\\d)\\b/);}
 if(!m)return "";
 let y=m[3];if(y.length<4)y="20"+y;
 return `${m[1].padStart(2,"0")}.${m[2].padStart(2,"0")}.${y}`;
}
function extractUnit(text){
 let t=String(text||"").toLowerCase().replace(/кr/g,"кг").replace(/кг\\./g,"кг");
 t=t.replace(/\\bк\\s*г\\b/g,"кг");
 const m=t.match(/(?:^|[^а-яёa-z0-9])((?:шт|кг|г|мг|л|мл|м|см|мм|упак|уп|порц|пара|пачка|пачк|бут))(?:\\.)?(?=$|[^а-яёa-z0-9])/iu);
 return m?m[1].toLowerCase():"";
}
function nameScore(s){
 let n=0;
 if(/[А-Яа-яЁё]/.test(s))n+=100;
 if(/\\bрыбный\\s+цех\\b/iu.test(s))n+=80;
 if(/\\bхе\\b/iu.test(s))n+=50;
 if(/\\bиз\\b|\\bвес\\b/iu.test(s))n+=15;
 if(/[A-Za-z]/.test(s)&&!/[А-Яа-яЁё]/.test(s))n-=80;
 if(/\\d{7,14}/.test(s))n-=150;
 if(/^(?:кг|шт|г|л|мл|руб|₽)$/iu.test(s))n-=200;
 return n+Math.min(60,s.length);
}
function extractName(text,price,unit,date,code2d){
 const lines=String(text||"").split(/\\n+/).map(x=>clean(x)).filter(Boolean);
 const out=[];
 for(const line of lines){
   let s=line;
   if(price)s=s.replace(new RegExp("(?<!\\\\d)"+price.replace(".","[.,]")+"\\\\s*(?:₽|P|Р|R|руб\\\\.?)","iu")," ");
   if(date)s=s.replace(new RegExp(date.replace(/\\./g,"[.]?\\\\s*"),"","i")," ");
   if(code2d)s=s.replace(code2d," ");
   s=clean(s);
   if(!/[А-Яа-яЁёA-Za-z]/.test(s))continue;
   if(unit&&new RegExp("^"+unit+"$","iu").test(s))continue;
   if(/^(?:₽|P|Р|R|руб\\.?|кг|шт)$/iu.test(s))continue;
   out.push(s);
 }
 return clean(out.sort((a,b)=>nameScore(b)-nameScore(a))[0]||"");
}
function parse(data,codes){
 const text=normalizedText(data.text||"");
 const price=extractPrice(data,text);
 const unit=extractUnit(text);
 const date=extractDate(text);
 const two=codes.find(x=>/^(qr_code|data_matrix|pdf417|aztec)$/i.test(x.format));
 const one=codes.find(x=>/^(ean_13|ean_8|upc_a|upc_e|code_128|code_39|itf|codabar)$/i.test(x.format));
 const code2d=two?.rawValue||"";
 const barcode=one?.rawValue||(/^\\d{8,14}$/.test(code2d)?code2d:"");
 const name=extractName(text,price,unit,date,code2d);
 const useful=(name?120:0)+(price?100:0)+(unit?50:0)+(date?30:0)+(code2d?30:0);
 return {name,price,unit,date,barcode,code2d,raw:text,confidence:Number(data.confidence||0),useful};
}
async function ocrOrientation(base,deg,codes){
 const c=prep(rotate(base,deg));
 const data=await worker.recognize(c);
 return {deg,...parse(data,codes)};
}
async function detectCodes(canvas){
 if(!("BarcodeDetector" in window))return [];
 try{
   const supported=await BarcodeDetector.getSupportedFormats();
   const wanted=["qr_code","data_matrix","pdf417","aztec","ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf","codabar"];
   const formats=wanted.filter(x=>supported.includes(x));
   return formats.length?await new BarcodeDetector({formats}).detect(canvas):[];
 }catch(e){return []}
}
async function capture(){
 if(!stream){$("status").textContent="Сначала запусти камеру.";return}
 const v=$("camera").querySelector("video");
 if(!v||!v.videoWidth){$("status").textContent="Камера ещё запускается.";return}
 $("scan").disabled=true;
 try{
   const full=document.createElement("canvas");full.width=v.videoWidth;full.height=v.videoHeight;
   full.getContext("2d").drawImage(v,0,0);
   const codes=await detectCodes(full);
   const results=[];
   await ensureWorker();
   // Always test both orientations. This is intentional: phone orientation must not affect recognition.
   for(const deg of [0,90])results.push(await ocrOrientation(full,deg,codes));
   // If neither orientation produced useful fields, try the reverse orientations.
   let best=results.sort((a,b)=>(b.useful+b.confidence*.35)-(a.useful+a.confidence*.35))[0];
   if(best.useful<150){
     for(const deg of [180,270])results.push(await ocrOrientation(full,deg,codes));
     best=results.sort((a,b)=>(b.useful+b.confidence*.35)-(a.useful+a.confidence*.35))[0];
   }
   const row=best;
   const two=codes.find(x=>/^(qr_code|data_matrix|pdf417|aztec)$/i.test(x.format));
   const one=codes.find(x=>/^(ean_13|ean_8|upc_a|upc_e|code_128|code_39|itf|codabar)$/i.test(x.format));
   row.code2d=two?.rawValue||row.code2d||"";
   row.barcode=one?.rawValue||(/^\\d{8,14}$/.test(row.code2d)?row.code2d:"");
   delete row.raw;delete row.confidence;delete row.useful;
   rows.push(row);render();
   $("ocr").textContent=results.map(r=>`--- ${r.deg}° (${Math.round(r.confidence)}%) ---\\n${r.raw}`).join("\\n");
   $("status").textContent=`Готово #${rows.length}: ${row.name||"название не найдено"} | ${row.price?row.price+" ₽":"цена не найдена"} | ${row.unit||"мера не найдена"} | ${row.date||"дата не найдена"}`;
 }catch(e){$("status").textContent="Ошибка: "+e.message}
 finally{$("scan").disabled=false}
}
async function startCamera(){
 try{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
  const v=document.createElement("video");v.autoplay=true;v.playsInline=true;v.muted=true;v.srcObject=stream;
  $("camera").innerHTML="";$("camera").appendChild(v);$("status").textContent="Камера готова.";
 }catch(e){$("status").textContent="Нет доступа к камере: "+e.message}
}
$("start").onclick=startCamera;$("scan").onclick=capture;
$("clear").onclick=()=>{if(confirm("Удалить все строки?")){rows=[];render();$("ocr").textContent=""}};
$("export").onclick=()=>{
 if(!rows.length){$("status").textContent="Нет данных.";return}
 const data=rows.map((r,i)=>({"№":i+1,"Название":r.name,"Цена":r.price,"Штрихкод / код товара":r.barcode,"Мера":r.unit,"Дата":r.date,"2D-код":r.code2d}));
 const ws=XLSX.utils.json_to_sheet(data);ws["!cols"]=[{wch:6},{wch:45},{wch:12},{wch:24},{wch:10},{wch:14},{wch:30}];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Ценники");XLSX.writeFile(wb,"price_tags.xlsx");
};
render();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
