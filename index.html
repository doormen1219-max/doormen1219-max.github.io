<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
let stream = null, worker = null;
let rows = JSON.parse(localStorage.getItem("priceRowsV6") || "[]");
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function render() {
  $("rows").innerHTML = rows.map(r =>
    `<tr><td>${esc(r.name)}</td><td>${esc(r.price)}</td><td>${esc(r.barcode)}</td><td>${esc(r.unit)}</td><td>${esc(r.date)}</td><td>${esc(r.code2d)}</td></tr>`
  ).join("");
  localStorage.setItem("priceRowsV6", JSON.stringify(rows));
}

function clean(s) {
  s = String(s || "")
    // 1. ИСПРАВЛЯЕМ OCR-ошибки ЕДИНИЦ И РУБЛЯ *ДО* удаления английских букв!
    .replace(/к\s*r\b/gi, "кг")
    .replace(/100\s*r\b/gi, "100г")
    .replace(/ш\s*t\b/gi, "шт")
    .replace(/\b[Pp]\b/g, "₽") // Одиночная P/p (англ) как отдельное слово -> ₽
    .replace(/[|¦∥ǀ]/g, " ")
    // 2. Теперь безопасно удаляем оставшиеся английские буквы
    .replace(/[A-Za-z]/g, "")
    .replace(/\s+/g, " ")
    .trim();
  
  // 3. Исправляем русские слова
  s = s
    .replace(/\b[XxХх][еeё]\b/giu, "Хе")
    .replace(/\bРыбн(?:ый|ьи|ь[ыи])\s+цех\b/iu, "Рыбный цех")
    .replace(/\bтолстолобика?\b/iu, "толстолобика");
    
  return s.replace(/^[\s.,:;=_-]+|[\s.,:;=_-]+$/g, "");
}

function rotate(src, deg) {
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  if (deg === 90 || deg === 270) {
    c.width = src.height; c.height = src.width;
  } else {
    c.width = src.width; c.height = src.height;
  }
  ctx.translate(c.width / 2, c.height / 2);
  ctx.rotate(deg * Math.PI / 180);
  ctx.drawImage(src, -src.width / 2, -src.height / 2);
  return c;
}

function cropPriceTag(src) {
  const maxSide = 1600;
  const scale = Math.min(1, maxSide / Math.max(src.width, src.height));
  const w = Math.round(src.width * scale);
  const h = Math.round(src.height * scale);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(src, 0, 0, w, h);

  const im = ctx.getImageData(0, 0, w, h);
  const d = im.data;
  let minX = w, minY = h, maxX = 0, maxY = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const yv = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const v = yv > 140 ? 255 : 0;
      d[i] = d[i + 1] = d[i + 2] = v;
      if (v > 200) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  ctx.putImageData(im, 0, 0);

  if (maxX - minX > w * 0.25 && maxY - minY > h * 0.15) {
    const pad = 8;
    minX = Math.max(0, minX - pad);
    minY = Math.max(0, minY - pad);
    maxX = Math.min(w - 1, maxX + pad);
    maxY = Math.min(h - 1, maxY + pad);
    const out = document.createElement("canvas");
    out.width = maxX - minX + 1;
    out.height = maxY - minY + 1;
    out.getContext("2d").drawImage(c, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
    return out;
  }
  return c;
}

function prep(src) {
  const max = 1400;
  const scale = Math.min(1, max / Math.max(src.width, src.height));
  const c = document.createElement("canvas");
  c.width = Math.round(src.width * scale);
  c.height = Math.round(src.height * scale);
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(src, 0, 0, c.width, c.height);
  const im = ctx.getImageData(0, 0, c.width, c.height);
  const d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    const z = Math.max(0, Math.min(255, (y - 128) * 1.55 + 128));
    d[i] = d[i + 1] = d[i + 2] = z;
  }
  ctx.putImageData(im, 0, 0);
  return c;
}

async function ensureWorker() {
  if (worker) return;
  $("status").textContent = "Загрузка русского OCR…";
  worker = await Tesseract.createWorker("rus", 1, {
    logger: m => {
      if (m.status === "loading language traineddata")
        $("status").textContent = "Загрузка OCR " + Math.round((m.progress || 0) * 100) + "%";
      if (m.status === "recognizing text")
        $("status").textContent = "Распознавание " + Math.round((m.progress || 0) * 100) + "%";
    }
  });
  await worker.setParameters({
    tessedit_pageseg_mode: "6",
    preserve_interword_spaces: "1",
    user_defined_dpi: "300",
    tessedit_char_whitelist: "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя0123456789.,₽/- "
  });
}

function wordsFrom(data) {
  return (data.words || []).map(w => ({
    text: clean(w.text),
    conf: Number(w.confidence || w.conf || 0),
    bbox: w.bbox || { x0: 0, y0: 0, x1: 0, y1: 0 },
    h: (w.bbox?.y1 || 0) - (w.bbox?.y0 || 0)
  })).filter(w => w.text);
}

/* ---------- ЦЕНА: крупные цифры + приоритет тем, что рядом с ₽ ---------- */
function extractPrice(data) {
  const ws = wordsFrom(data);
  const candidates = [];
  
  // Находим все слова, которые могут быть знаком рубля
  const rubleWords = ws.filter(w => /[₽рРpP]/.test(w.text) || /руб/i.test(w.text));
  
  for (const w of ws) {
    const originalText = w.text;
    const t = originalText.replace(/,/g, ".").replace(/[^\d.]/g, "");
    if (!/^\d{1,6}(?:\.\d{1,2})?$/.test(t)) continue;
    const num = Number(t);
    if (num < 1 || num > 999999) continue;
    
    // Базовый скор на основе высоты (крупные цифры)
    let score = w.h * (w.conf / 50);
    
    // Проверяем, есть ли знак рубля поблизости (справа от числа)
    const isNearRuble = rubleWords.some(rw => {
      const horizontalDist = rw.bbox.x0 - w.bbox.x1;
      const verticalDist = Math.abs(rw.bbox.y0 - w.bbox.y0);
      // Рубль должен быть справа (или чуть-чуть слева, если прилип) и на той же строке
      return horizontalDist > -30 && horizontalDist < 200 && verticalDist < w.h * 1.5;
    });
    
    if (isNearRuble || /[₽рРpP]/.test(originalText) || /руб/i.test(originalText)) {
      score += 2000; // Огромный приоритет числам рядом с рублём
    }
    
    candidates.push({ value: t, score: score, conf: w.conf });
  }
  if (!candidates.length) return "";
  candidates.sort((a, b) => b.score - a.score);
  return candidates[0].value;
}

/* ---------- ДАТА: поддержка двухэтажной даты (например, "29.08.2 6") ---------- */
function extractDate(text) {
  const t = String(text || "").replace(/\s+/g, " ");
  // 1. Обычная дата: 29.08.26 или 29.08.2026
  let m = t.match(/\b(0?[1-9]|[12]\d|3[01])\s*[./-]\s*(0?[1-9]|1[0-2])\s*[./-]\s*(20\d{2}|\d{2})\b/);
  if (m) {
    let y = m[3];
    if (y.length === 2) y = "20" + y;
    return `${m[1].padStart(2, "0")}.${m[2].padStart(2, "0")}.${y.slice(-2)}`;
  }
  // 2. Двухэтажная дата: 29.08.2 6 (или 29.08.2 \n 6)
  m = t.match(/\b(0?[1-9]|[12]\d|3[01])\s*[./-]\s*(0?[1-9]|1[0-2])\s*[./-]\s*(\d)\s+(\d)\b/);
  if (m) {
    let y = "20" + m[3] + m[4];
    return `${m[1].padStart(2, "0")}.${m[2].padStart(2, "0")}.${y.slice(-2)}`;
  }
  return "";
}

/* ---------- ЕДИНИЦА: максимальная устойчивость к OCR-ошибкам ---------- */
function extractUnit(text) {
  const t = String(text || "").toLowerCase();
  // Нормализуем частые ошибки OCR для единиц измерения
  const normalized = t
    .replace(/к\s*[rг]\.?\s*/g, "кг")
    .replace(/100\s*[rг]\.?\s*/g, "100г")
    .replace(/ш\s*т\.?\s*/g, "шт")
    .replace(/к\s*г/g, "кг");
  
  if (/\b100г\b/.test(normalized) || normalized.includes("100г")) return "100г";
  if (/\bкг\b/.test(normalized) || normalized.includes("кг")) return "кг";
  if (/\bшт\b/.test(normalized) || normalized.includes("шт")) return "шт";
  
  return "";
}

/* ---------- НАЗВАНИЕ ---------- */
function nameScore(s) {
  let n = 0;
  if (/[А-Яа-яЁё]/.test(s)) n += 120;
  if (/рыбный\s+цех/iu.test(s)) n += 90;
  if (/\bхе\b/iu.test(s)) n += 60;
  if (/толстолобик/iu.test(s)) n += 80;
  if (/\bиз\b/iu.test(s)) n += 20;
  if (/\d{7,}/.test(s)) n -= 200;
  if (/^(?:кг|шт|100г|руб|₽)$/iu.test(s)) n -= 300;
  return n + Math.min(50, s.length);
}

function extractName(text, price, unit, date, barcode) {
  const lines = String(text || "").split(/\n+/).map(x => clean(x)).filter(Boolean);
  const out = [];
  for (let line of lines) {
    let s = line;
    if (price) {
      s = s.replace(new RegExp("(?<!\\d)" + price.replace(".", "[.,]") + "\\s*(?:₽|руб\\.?)?", "iu"), " ");
    }
    if (date) {
      // Удаляем дату, учитывая возможный разрыв (двухэтажная)
      const dParts = date.split(".");
      if (dParts.length === 3) {
        const dateRegex = new RegExp(`${dParts[0]}\\s*[./-]\\s*${dParts[1]}\\s*[./-]\\s*${dParts[2].charAt(0)}\\s*${dParts[2].charAt(1)}`, "i");
        s = s.replace(dateRegex, " ");
        s = s.replace(new RegExp(date.replace(/\./g, "[./-]?\\s*"), "i"), " ");
      }
    }
    if (barcode) s = s.replace(barcode, " ");
    if (unit) {
      const unitRegex = new RegExp(unit.replace("100г", "100\\s*г").replace("кг", "к\\s*[rг]").replace("шт", "ш\\s*т"), "iu");
      s = s.replace(unitRegex, " ");
    }
    s = clean(s);
    if (!/[А-Яа-яЁё]/.test(s)) continue;
    if (/^(?:₽|руб|кг|шт|100г)$/iu.test(s)) continue;
    out.push(s);
  }
  if (!out.length) return "";
  return clean(out.sort((a, b) => nameScore(b) - nameScore(a))[0]);
}

function parse(data, codes) {
  const text = clean(data.text || "");
  const price = extractPrice(data);
  const unit  = extractUnit(text);
  const date  = extractDate(text);

  const two = codes.find(x => /^(qr_code|data_matrix|pdf417|aztec)$/i.test(x.format));
  const one = codes.find(x => /^(ean_13|ean_8|upc_a|upc_e|code_128|code_39|itf|codabar)$/i.test(x.format));

  const code2d = two?.rawValue || "";
  let barcode = one?.rawValue || "";
  if (!barcode && /^\d{8,14}$/.test(code2d)) barcode = code2d;

  const name = extractName(text, price, unit, date, barcode);

  const useful =
    (name ? 130 : 0) +
    (price ? 110 : 0) +
    (unit ? 60 : 0) +
    (date ? 40 : 0) +
    (barcode ? 50 : 0);

  return {
    name, price, unit, date, barcode, code2d,
    raw: text,
    confidence: Number(data.confidence || 0),
    useful
  };
}

async function ocrOrientation(base, deg, codes) {
  const rotated = rotate(base, deg);
  const cropped = cropPriceTag(rotated);
  const prepared = prep(cropped);
  const data = await worker.recognize(prepared);
  return { deg, ...parse(data, codes) };
}

async function detectCodes(canvas) {
  if (!("BarcodeDetector" in window)) return [];
  try {
    const supported = await BarcodeDetector.getSupportedFormats();
    const wanted = ["qr_code","data_matrix","pdf417","aztec","ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf","codabar"];
    const formats = wanted.filter(x => supported.includes(x));
    return formats.length ? await new BarcodeDetector({ formats }).detect(canvas) : [];
  } catch (e) {
    return [];
  }
}

async function capture() {
  if (!stream) {
    $("status").textContent = "Сначала запусти камеру.";
    return;
  }
  const v = $("camera").querySelector("video");
  if (!v || !v.videoWidth) {
    $("status").textContent = "Камера ещё запускается.";
    return;
  }
  $("scan").disabled = true;
  try {
    const full = document.createElement("canvas");
    full.width = v.videoWidth;
    full.height = v.videoHeight;
    full.getContext("2d").drawImage(v, 0, 0);

    const codes = await detectCodes(full);
    await ensureWorker();

    const results = [];
    for (const deg of [0, 90, 180, 270]) {
      results.push(await ocrOrientation(full, deg, codes));
    }

    const best = results.sort((a, b) =>
      (b.useful + b.confidence * 0.4) - (a.useful + a.confidence * 0.4)
    )[0];

    const two = codes.find(x => /^(qr_code|data_matrix|pdf417|aztec)$/i.test(x.format));
    const one = codes.find(x => /^(ean_13|ean_8|upc_a|upc_e|code_128|code_39|itf|codabar)$/i.test(x.format));
    best.code2d = two?.rawValue || best.code2d || "";
    if (one?.rawValue) best.barcode = one.rawValue;
    else if (/^\d{8,14}$/.test(best.code2d)) best.barcode = best.code2d;

    const row = {
      name: best.name,
      price: best.price,
      barcode: best.barcode,
      unit: best.unit,
      date: best.date,
      code2d: best.code2d
    };
    rows.push(row);
    render();

    $("ocr").textContent = results.map(r =>
      `--- ${r.deg}° (useful=${r.useful}, conf=${Math.round(r.confidence)}) ---\n${r.raw}`
    ).join("\n\n");

    $("status").textContent =
      `Готово #${rows.length}: ${row.name || "—"} | ${row.price || "—"} ₽ | ${row.unit || "—"} | ${row.date || "—"} | ${row.barcode || "—"}`;
  } catch (e) {
    $("status").textContent = "Ошибка: " + e.message;
  } finally {
    $("scan").disabled = false;
  }
}

async function startCamera() {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    const v = document.createElement("video");
    v.autoplay = true; v.playsInline = true; v.muted = true;
    v.srcObject = stream;
    $("camera").innerHTML = "";
    $("camera").appendChild(v);
    $("status").textContent = "Камера готова.";
  } catch (e) {
    $("status").textContent = "Нет доступа к камере: " + e.message;
  }
}

$("start").onclick = startCamera;
$("scan").onclick = capture;
$("clear").onclick = () => {
  if (confirm("Удалить все строки?")) {
    rows = [];
    render();
    $("ocr").textContent = "";
  }
};
$("export").onclick = () => {
  if (!rows.length) {
    $("status").textContent = "Нет данных.";
    return;
  }
  const data = rows.map((r, i) => ({
    "№": i + 1,
    "Название": r.name,
    "Цена": r.price,
    "Код товара": r.barcode,
    "Мера": r.unit,
    "Дата": r.date,
    "2D-код": r.code2d
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws["!cols"] = [{wch:6},{wch:45},{wch:12},{wch:18},{wch:10},{wch:12},{wch:28}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Ценники");
  XLSX.writeFile(wb, "price_tags.xlsx");
};

render();
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
